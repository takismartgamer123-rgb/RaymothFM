name: Debian 12 Bookworm QA

on:
  push:
    branches:
      - main
      - gamma-bookworm-lite
      - gamma-legacy-polish
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bookworm:
    name: Build Bookworm package (${{ matrix.arch }})
    runs-on: ubuntu-latest
    container:
      image: debian:12-slim
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386]
    env:
      TARGET_ARCH: ${{ matrix.arch }}
      DEB_HOST_ARCH: ${{ matrix.arch }}

    steps:
      - name: Install build dependencies
        run: |
          set -eu
          if [ "$TARGET_ARCH" = i386 ]; then dpkg --add-architecture i386; fi
          apt-get update
          if [ "$TARGET_ARCH" = i386 ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential gcc-multilib g++-multilib cmake git pkg-config dpkg-dev file \
              libarchive-dev:i386 libmagic-dev:i386 libssl-dev:i386 \
              libgl1-mesa-dev:i386 libx11-dev:i386 libxrandr-dev:i386 \
              libxcursor-dev:i386 libxi-dev:i386 libxinerama-dev:i386 ca-certificates
          else
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential cmake git pkg-config dpkg-dev file libarchive-dev libmagic-dev \
              libssl-dev libgl1-mesa-dev libx11-dev libxrandr-dev libxcursor-dev \
              libxi-dev libxinerama-dev ca-certificates
          fi
          rm -rf /var/lib/apt/lists/*

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build static Raylib
        run: |
          set -eu
          git clone --depth 1 --branch 5.5 https://github.com/raysan5/raylib.git /tmp/raylib
          CMAKE_FLAGS=""
          if [ "$TARGET_ARCH" = i386 ]; then
            CMAKE_FLAGS="-DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32 -DCMAKE_SHARED_LINKER_FLAGS=-m32"
          fi
          cmake -S /tmp/raylib -B /tmp/raylib/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/opt/raylib \
            -DBUILD_SHARED_LIBS=OFF -DBUILD_EXAMPLES=OFF -DUSE_EXTERNAL_GLFW=OFF \
            $CMAKE_FLAGS
          cmake --build /tmp/raylib/build --parallel "$(nproc)"
          cmake --install /tmp/raylib/build
          echo "PKG_CONFIG_PATH=/opt/raylib/lib/pkgconfig" >> "$GITHUB_ENV"
          if [ "$TARGET_ARCH" = i386 ]; then
            echo "PKG_CONFIG_LIBDIR=/opt/raylib/lib/pkgconfig:/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig" >> "$GITHUB_ENV"
          fi

      - name: Verify Bookworm dependencies
        run: |
          set -eu
          pkg-config --modversion raylib libarchive libmagic openssl
          if pkg-config --exists vips; then echo "Unexpected libvips in Lite build"; exit 1; fi

      - name: Build RayMothFM (lite)
        run: |
          set -eu
          make -C code clean
          if [ "$TARGET_ARCH" = i386 ]; then
            make -C code --jobs="$(nproc)" WITH_VIPS=0 CXX="g++ -m32" \
              CXXFLAGS="-m32 -std=c++20 -O2 -flto -Wall -Wextra -Wpedantic" \
              LDFLAGS="-m32 -flto -s -Wl,--as-needed"
          else
            make -C code --jobs="$(nproc)" WITH_VIPS=0
          fi
          file code/raymothfm
          if [ "$TARGET_ARCH" = i386 ]; then
            file code/raymothfm | grep -E 'ELF 32-bit.*Intel 80386'
          else
            file code/raymothfm | grep -E 'ELF 64-bit'
          fi

      - name: Smoke tests and runtime audit
        run: |
          set -eu
          ./code/raymothfm --version
          ./code/raymothfm --help
          test_home="$(mktemp -d)"
          HOME="$test_home" ./code/raymothfm --mkcfg
          test -s "$test_home/.config/raymothfm/config"
          ldd ./code/raymothfm | tee /tmp/raymothfm-ldd.txt
          ! grep -E 'not found|libvips|libraylib\.so' /tmp/raymothfm-ldd.txt

      - name: Test DESTDIR installation
        run: |
          set -eu
          stage="$(pwd)/.install-stage"
          rm -rf "$stage"
          DESTDIR="$stage" make -C code install
          test -x "$stage/usr/bin/raymothfm"
          test -s "$stage/usr/share/applications/raymothfm.desktop"
          test -s "$stage/usr/share/doc/raymothfm/copyright"
          test -s "$stage/usr/share/doc/raymothfm/RAYLIB-5.5.txt"
          test -s "$stage/usr/share/doc/raymothfm/GLFW.txt"
          test -s "$stage/usr/share/doc/raymothfm/NOTICE"
          rm -rf "$stage"

      - name: Build Debian package
        run: |
          sh distro/debian/build-package.sh
          dpkg-deb --contents dist/*.deb
          dpkg-deb -f dist/*.deb Architecture

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: raymothfm-debian12-bookworm-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone binary (optional)
        uses: actions/upload-artifact@v4
        with:
          name: raymothfm-bookworm-lite-${{ matrix.arch }}-binary
          path: code/raymothfm
          if-no-files-found: error
          retention-days: 7
